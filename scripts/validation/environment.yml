name: mcmc-validation
channels:
  - conda-forge
# The generator installs the checksum-pinned posterior 1.7.1 source into its
# private cache library. The conda posterior supplies its R dependencies.
dependencies:
  - r-base=4.5.2
  - r-posterior=1.7.0
  - r-matrixstats=1.5.0
  - python=3.13
  - numpy=2.5.4
  - h5netcdf=1.8.2
  - h5py=3.16.0
