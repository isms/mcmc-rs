[package]
name = "mcmc"
version = "0.2.0"
authors = ["Isaac Slavitt <isaac.slavitt@gmail.com>"]
edition = "2024"
rust-version = "1.85"
description = """\
  A Rust library implementing various MCMC \
  diagnostics and utilities, such as Gelman Rubin potential \
  scale reduction factor (R hat), effective sample size (ESS), \
  chain splitting, and others.\
  """
license = "MIT"
keywords = ["mcmc", "monte", "carlo", "markov"]
repository = "https://github.com/isms/mcmc-rs/"
documentation = "https://docs.rs/mcmc"

[features]
default = []
ndarray = ["dep:ndarray"]
simd = ["dep:wide"]

[dependencies]
anyhow = "1"
average = "0.17"
ndarray = { version = "0.17", optional = true }
# This release supports our Rust 1.85 minimum.
wide = { version = "0.7.33", optional = true }

[dev-dependencies]
approx = "0.5"
arima = "0.3"

[[bench]]
name = "diagnostics"
harness = false
